name: Deploy To IIS

on:

  push:
    branches:
      - main

env:
  DOTNET_VERSION: "8.0.x"

jobs:

  build:

    runs-on: windows-latest

    steps:

    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup DotNet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore Packages
      run: dotnet restore

    - name: Build Project
      run: dotnet build -c Release --no-restore

    - name: Publish Application
      run: |
        dotnet publish `
        -c Release `
        -o publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: publish

  deploy:

    needs: build

    runs-on: windows-latest

    steps:

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: publish

    - name: Install Web Deploy
      shell: powershell
      run: |

        choco install webdeploy `
        -y

    - name: Deploy To IIS
      shell: powershell

      env:
        IIS_SERVER: ${{ secrets.IIS_SERVER }}
        IIS_USERNAME: ${{ secrets.IIS_USERNAME }}
        IIS_PASSWORD: ${{ secrets.IIS_PASSWORD }}
        IIS_SITE_NAME: ${{ secrets.IIS_SITE_NAME }}

      run: |

        $PackagePath="$pwd\publish"

        $msdeploy="C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

        & $msdeploy `
        -verb:sync `
        -source:contentPath="$PackagePath" `
        -dest:contentPath="$env:IIS_SITE_NAME",computerName="https://$env:IIS_SERVER`:8172/msdeploy.axd?site=$env:IIS_SITE_NAME",userName="$env:IIS_USERNAME",password="$env:IIS_PASSWORD",authType="Basic" `
        -allowUntrusted
